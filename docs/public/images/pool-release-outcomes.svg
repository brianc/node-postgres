<defs><style>@font-face{font-family:Inter;src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:400}@font-face{font-family:Inter;src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:700}svg{font-family:Inter, sans-serif}</style></defs><title>Pool client release outcomes for a waiting caller</title><desc>With max one, caller B waits while A holds the client. A normal release reuses that client; release with an error removes it and B receives a replacement.</desc><rect width="580" height="608" fill="#ffffff"></rect><g class="composition-body" transform="translate(20 20) scale(1)"><g><g class="diagram-surface diagram-surface-bare"><rect x="0" y="0" width="540" height="568" rx="10" fill="#f8fafc"></rect></g><g class="diagram-connector diagram-connector-orthogonal diagram-connector-head"><path d="M121 80L121 104" fill="none" stroke="#cbd5e1" stroke-width="1.5"></path><path d="M115 104L121 114L127 104Z" fill="#cbd5e1"></path></g><g class="diagram-connector diagram-connector-orthogonal diagram-connector-head"><path d="M121 178L121 202" fill="none" stroke="#cbd5e1" stroke-width="1.5"></path><path d="M115 202L121 212L127 202Z" fill="#cbd5e1"></path></g><path class="diagram-connector diagram-connector-orthogonal" d="M121 348L121 354" fill="none" stroke="#cbd5e1" stroke-width="1.5"></path><g class="diagram-connector diagram-connector-orthogonal diagram-connector-head"><path d="M121 392L121 398" fill="none" stroke="#cbd5e1" stroke-width="1.5"></path><path d="M115 398L121 408L127 398Z" fill="#cbd5e1"></path></g><g class="diagram-connector diagram-connector-orthogonal diagram-connector-head"><path d="M121 472L121 496" fill="none" stroke="#cbd5e1" stroke-width="1.5"></path><path d="M115 496L121 506L127 496Z" fill="#cbd5e1"></path></g><path class="diagram-connector diagram-connector-orthogonal" d="M236 280L248 280" fill="none" stroke="#cbd5e1" stroke-width="1.5"></path><g class="diagram-connector diagram-connector-orthogonal diagra