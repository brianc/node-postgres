es-middle" text-anchor="middle" font-size="14" font-weight="700" fill="#243c56"><text class="diagram-text-lines-line" x="121" y="275.54">Release includes</text><text class="diagram-text-lines-line" x="121" y="294.54">an error?</text></g></g><g><g class="diagram-surface"><rect x="25.5" y="416.5" width="191" height="47" rx="9.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"></rect></g><g class="diagram-text-lines" text-anchor="start" font-size="14" font-weight="700" fill="#334155"><text class="diagram-text-lines-line" x="39" y="445.04">Reuse the healthy client</text></g></g><g class="diagram-flow-shape diagram-flow-shape-stadium"><path d="M37 514H205A20 20 0 0 1 205 554H37A20 20 0 0 1 37 514Z" fill="#ffffff" stroke="#385c85" stroke-opacity="1" stroke-width="1"></path><g class="diagram-text-lines diagram-text-lines-middle" text-anchor="middle" font-size="14" font-weight="700" fill="#243c56"><text class="diagram-text-lines-line" x="121" y="539.04">B receives the same client</text></g></g><g><g class="diagram-surface"><rect x="336.5" y="247.5" width="189" height="65" rx="9.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"></rect></g><g class="diagram-text-lines" text-anchor="start" font-size="14" font-weight="700" fill="#334155"><text class="diagram-text-lines-line" x="350" y="275.54">Remove client; connect</text><text class="diagram-text-lines-line" x="350" y="294.54">replacement</text></g></g><g class="diagram-flow-shape diagram-flow-shape-stadium"><path d="M358 420H504A20 20 0 0 1 504 460H358A20 20 0 0 1 358 420Z" fill="#ffffff" stroke="#385c85" stroke-opacity="1" stroke-width="1"></path><g class="diagram-text-lines diagram-text-lines-middle" text-anchor="middle" font-size="14" font-weight="700" fill="#243c56"><text class="diagram-text-lines-line" x="431" y="445.04">B receives a new client</text></g></g></g></g></svg>
