name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
  build:
    timeout-minutes: 15
    needs: lint
    services:
      postgres:
        image: ghcr.io/railwayapp-templates/postgres-ssl:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: 'md5'
          POSTGRES_DB: ci_db_test
          # PostgreSQL 18's official image defaults PGDATA to a versioned
          # subdirectory (/var/lib/postgresql/18/docker), but the
          # railwayapp-templates/postgres-ssl entrypoint requires PGDATA to
          # start with /var/lib/postgresql/data so we pin it explicitly. This is
          # also the default for the older images, so it is a no-op there.
          PGDATA: /var/lib/postgresql/data
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          # Historical Node.js versions tested against a single PostgreSQL version
          - { node: '16', postgres: &stable_postgres '18' }
          - { node: '18', postgres: *stable_postgres }
          - { node: '20', postgres: *stable_postgres }
          - { node: '22', postgres: *stable_postgres }
          - { node: '24', postgres: *stable_postgres }
          # Latest Node.js version tested against multiple PostgreSQL versions
          - { node: &latest_node '26', postgres: '13' }
          - { node: *latest_node, postgres: '14' }
          - { node: *latest_node, postgres: '15' }
          - { node: *latest_node, postgres: '16' }
          - { node: *latest_node, postgres: '17' }
          - { node: *latest_node, postgres: '18' }
    name: Node.js ${{ matrix.node }} x PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      PGDATABASE: ci_db_test
      PGTESTNOSSL: 'true'
      SCRAM_TEST_PGUSER: scram_test
      SCRAM_TEST_PGPASSWORD: test4scram
      SCRAM_TEST_PGUSER_UNICODE: scram_unicode_test
      # Raw form of a password whose NFKC normalization differs from itself.
      # U+2168 (ROMAN NUMERAL IX) decomposes to ASCII "IX" under NFKC; the
      # server stores the verifier from the SASLprep-normalized form, so the
      # client must apply SASLprep too. This is the regression check for the
      # RFC 4013 fix in packages/pg/lib/crypto/sasl.js.
      SCRAM_TEST_PGPASSWORD_UNICODE: "IX-\u2168"
    steps:
      - name: Show OS
        run: |
          uname -a
      - run: |
          psql \
            -c "SET password_encryption = 'scram-sha-256'" \
            -c "CREATE ROLE scram_test LOGIN PASSWORD 'test4scram'" \
            -c "CREATE ROLE scram_unicode_test LOGIN PASSWORD U&'IX-\2168'"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test

  # A few fuzz rounds on a seed nobody chose, every push and every pull request. One run proves
  # nothing; a few hundred runs walk over ground no hand written test reaches, and the seed
  # changes every time so the coverage accumulates across pushes. A divergence turns this job
  # red and prints the seed that reproduces it, with the case shrunk to the lines worth pasting
  # into a test: replay it locally with `node fuzz/<tool>.js --seed N --rounds 1`.
  #
  # What the first runs found, each fixed in its own pull request: #3776 (a copyData chunk
  # changing under whoever kept it), #3777 (binary results losing every byte utf8 cannot
  # carry), #3778 (pg-native reporting NaN and '' for a missing row count or command), #3780
  # (native errors without detail and hint), #3781 (a named empty statement failing from its
  # second run). And one it cannot fix here: a Buffer parameter reaches libpq as a C string,
  # #980, so the native arm draws none.
  fuzz:
    timeout-minutes: 15
    needs: lint
    services:
      postgres:
        image: ghcr.io/railwayapp-templates/postgres-ssl:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: 'md5'
          POSTGRES_DB: ci_db_test
          PGDATA: /var/lib/postgresql/data
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    runs-on: ubuntu-latest
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      PGDATABASE: ci_db_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Fuzz the protocol parser against the bytes it was given, cut at random points
        run: node fuzz/wire.js --rounds 500
      - name: Fuzz pg against itself in every query mode
        run: node fuzz/modes.js --rounds 100
      - name: Fuzz pg against pg-native
        run: node fuzz/native.js --rounds 100
